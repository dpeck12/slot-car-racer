<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Slot-Car Racer</title>
    <meta name="description" content="A browser-based slot-car racing game. Race three bots around a technical circuit." />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏁</text></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600&display=swap" rel="stylesheet">
    <style>
      html, body { height: 100%; margin: 0; background: #1f6f2f; color: #eee; font-family: 'Inter', system-ui, sans-serif; overflow: hidden; }
      #app { width: 100%; height: 100%; }
      #app canvas { position: relative; z-index: 0; touch-action: none; display: block; }

      .hud {
        position: absolute; left: 12px; top: 12px; z-index: 900;
        background: rgba(18, 18, 18, 0.8); border: 1px solid #333; border-radius: 8px;
        padding: 8px 12px; font-size: 13px; line-height: 1.4;
      }
      .hud table { border-collapse: collapse; font-variant-numeric: tabular-nums; }
      .hud th { font-weight: 500; color: #999; text-align: left; padding: 0 10px 2px 0; }
      .hud td { padding: 0 10px 0 0; }
      .hud tr.you td { font-weight: 600; color: #fff; }
      .hud .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; }
      .hud-controls { margin-top: 6px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
      .hud .hint { color: #999; }
      .hud select { font: inherit; }

      .race-message {
        position: absolute; left: 50%; top: 45%; transform: translate(-50%, -50%); z-index: 900;
        font-size: 48px; font-weight: 600; color: #ff4d4f; pointer-events: none; text-shadow: 0 2px 8px #000;
      }
      .start-ui { background: rgba(18, 18, 18, 0.88); border: 1px solid #333; border-radius: 12px; padding: 24px 28px; max-width: min(90vw, 460px); box-sizing: border-box; }
      .how-to { font-size: 16px; line-height: 1.6; color: #ddd; margin-bottom: 16px; }
      .how-to kbd { background: #333; border: 1px solid #555; border-radius: 4px; padding: 0 6px; font-family: inherit; }

      @media (max-width: 600px) {
        .hud { font-size: 11px; padding: 6px 8px; }
        .hud .hint { display: none; }
        .how-to { font-size: 14px; }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
